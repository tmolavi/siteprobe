[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siteprobe"
version = "0.1.1"
description = "Open-source autonomous website auditor & fixer for SEO, GEO, performance, accessibility and technical web quality."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Taqi Molavi", email = "taqimolavi@gmail.com" }
]
keywords = [
    "seo", "technical-seo", "seo-audit", "geo", "aeo", "ai-search",
    "generative-engine-optimization", "website-audit", "core-web-vitals",
    "accessibility", "crawler", "mcp", "model-context-protocol", "agent-skills"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.1",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
lighthouse = []
google = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
]
ai = [
    "litellm>=1.30.0",
]
all = [
    "siteprobe[browser,google,ai]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
siteprobe = "siteprobe.cli.main:app"

[project.urls]
Homepage = "https://github.com/tmolavi/siteprobe"
Documentation = "https://github.com/tmolavi/siteprobe#readme"
Repository = "https://github.com/tmolavi/siteprobe.git"
Issues = "https://github.com/tmolavi/siteprobe/issues"
Changelog = "https://github.com/tmolavi/siteprobe/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
